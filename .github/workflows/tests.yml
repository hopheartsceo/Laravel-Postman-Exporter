name: Hybrid Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Build Native Go Engine
        run: ./engine/build.sh
      - name: Run PHPUnit & Go Race Detector Tests
        run: composer test
