name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '8'
            laravel: '10'
          - php: '8.2'
            testbench: '9'
            laravel: '11'
          - php: '8.4'
            testbench: '10'
            laravel: '12'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --no-check-lock

      - name: Select Laravel version
        run: composer require --dev --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --no-blocking

      - name: Run tests
        run: composer test
